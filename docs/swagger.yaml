openapi: 3.0.0
info:
  title: Housing Rental API
  version: 1.0.0
  description: API для работы с предложениями, отзывами и пользователями
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        userType:
          type: string
          enum: [normal, pro]
        avatar:
          type: string
    Offer:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        price:
          type: integer
        city:
          type: object
          properties:
            name:
              type: string
            location:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                zoom:
                  type: integer
        isFavorite:
          type: boolean
        isPremium:
          type: boolean
        rating:
          type: number
        previewImage:
          type: string
    FullOffer:
      allOf:
        - $ref: '#/components/schemas/Offer'
        - type: object
          properties:
            description:
              type: string
            images:
              type: array
              items:
                type: string
            goods:
              type: array
              items:
                type: string
            host:
              type: object
              properties:
                name:
                  type: string
                avatarUrl:
                  type: string
                isPro:
                  type: boolean
            bedrooms:
              type: integer
            maxAdults:
              type: integer
            commentsCount:
              type: integer
    Review:
      type: object
      properties:
        id:
          type: string
        comment:
          type: string
        rating:
          type: integer
        date:
          type: string
          format: date-time
        user:
          type: object
          properties:
            name:
              type: string
            avatarUrl:
              type: string
            isPro:
              type: boolean
    Error:
      type: object
      properties:
        message:
          type: string
tags:
  - name: Users
    description: Управление пользователями и аутентификация
  - name: Offers
    description: Управление предложениями аренды
  - name: Reviews
    description: Управление отзывами

paths:
  # ========== USERS ==========
  /users/registration:
    post:
      summary: Регистрация нового пользователя
      tags: [Users]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - username
                - userType
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                username:
                  type: string
                userType:
                  type: string
                  enum: [normal, pro]
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Пользователь успешно создан
        "400":
          description: Ошибка валидации или email уже существует

  /users/login:
    post:
      summary: Авторизация пользователя
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Успешный логин, возвращает токен
        "400":
          description: Неверный email или пароль
    get:
      summary: Проверка авторизации
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Пользователь авторизован
        "401":
          description: Не авторизован

  /users/logout:
    delete:
      summary: Выход из системы
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Успешный выход
        "401":
          description: Не авторизован

  # ========== OFFERS ==========
  /offers:
    get:
      summary: Получить все предложения
      tags: [Offers]
      responses:
        "200":
          description: Список всех предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        "500":
          description: Внутренняя ошибка сервера

  /offers/favorites:
    get:
      summary: Получить избранные предложения
      tags: [Offers]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список избранных предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        "401":
          description: Не авторизован

  /offers/{id}:
    get:
      summary: Получить предложение по ID
      tags: [Offers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Детальная информация о предложении
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOffer'
        "404":
          description: Предложение не найдено

  /offers/{offerId}/favorite:
    post:
      summary: Переключить статус избранного
      tags: [Offers]
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: boolean
      responses:
        "200":
          description: Статус избранного обновлен
        "401":
          description: Не авторизован
        "404":
          description: Предложение не найдено

  /offers/{id}/nearby:
    get:
      summary: Получить ближайшие предложения
      tags: [Offers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Список ближайших предложений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        "404":
          description: Предложение не найдено

  /offer:
    post:
      summary: Создание нового предложения
      description: >
        Создает новое предложение (offer).
        Принимает данные в формате multipart/form-data.
        Поле previewImage обязательно.
        Поле photos — массив из 6 файлов.
      tags: [Offers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - city
                - price
                - rooms
                - guests
                - previewImage
              properties:
                title:
                  type: string
                description:
                  type: string
                publishDate:
                  type: string
                  format: date
                city:
                  type: string
                isPremium:
                  type: boolean
                isFavorite:
                  type: boolean
                rating:
                  type: number
                type:
                  type: string
                rooms:
                  type: integer
                guests:
                  type: integer
                price:
                  type: number
                features:
                  type: string
                  description: JSON-строка массива
                commentsCount:
                  type: integer
                latitude:
                  type: number
                longitude:
                  type: number
                userId:
                  type: integer
                previewImage:
                  type: string
                  format: binary
                  description: Основное изображение (обязательно)
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Дополнительные изображения
      responses:
        "201":
          description: Предложение успешно создано
        "400":
          description: Ошибка валидации данных
        "401":
          description: Не авторизован

  # ========== REVIEWS ==========
  /comments/{offerId}:
    get:
      summary: Получить отзывы для предложения
      tags: [Reviews]
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Список отзывов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        "404":
          description: Предложение не найдено
    post:
      summary: Добавить отзыв
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
                - rating
              properties:
                comment:
                  type: string
                  minLength: 5
                  maxLength: 1024
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "201":
          description: Отзыв добавлен
        "400":
          description: Ошибка валидации
        "401":
          description: Не авторизован
        "404":
          description: Предложение не найдено
